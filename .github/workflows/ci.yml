name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - name: Verify generated palette is up to date
        run: |
          npm run tokens
          git diff --exit-code src/shared/config/theme/palette.css
      - run: npm run build
